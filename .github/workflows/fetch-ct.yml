name: Fetch CT images from Wikimedia Commons

# 頭部CTよみ道場に使う、自由なライセンスの CT 画像の候補を集める。
# tools/fetch_commons.py を直して push したとき、または手動で動かす。
on:
  push:
    paths:
      - 'tools/fetch_commons.py'
      - '.github/workflows/fetch-ct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect candidates
        run: python3 tools/fetch_commons.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ct-src
          git diff --cached --quiet || git commit -m "CT 画像の候補を Wikimedia Commons から集める（自動）"
          git push
