/* ---------- 土台 ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{text-wrap:balance}

/* ---------- 上部バー ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:920px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);min-height:56px;display:flex;align-items:center;gap:6px}
.brand{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;font-family:var(--f-display);font-size:18px;letter-spacing:.02em;color:var(--ink);text-decoration:none;white-space:nowrap;flex:none}
.brand b{font-weight:inherit;color:var(--accent)}
#rankchip{margin-left:auto;display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 11px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:13px;line-height:1.2;white-space:nowrap;min-width:0;max-width:100%;overflow:hidden;cursor:pointer;touch-action:manipulation;transition:border-color .15s,transform .15s}
#rankchip:hover{border-color:var(--accent)}
#rankchip:active{transform:scale(.97)}
#rankchip.bump{animation:rankBump .6s cubic-bezier(.2,1.4,.4,1)}
#rankchip b{font-weight:800;overflow:hidden;text-overflow:ellipsis}
.rk-ic{flex:none;width:15px;height:15px;color:var(--gold)}
.rk-n{flex:none;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:700}
.top-btn,#soundbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--paper);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;touch-action:manipulation;transition:border-color .15s,background .15s,transform .1s}
.top-btn:hover,#soundbtn:hover{border-color:var(--accent)}
.top-btn:active,#soundbtn:active{transform:scale(.96)}
.top-btn svg,#soundbtn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#themebtn{padding:0;width:44px}
#soundbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#choice-settings summary{list-style:none}
#choice-settings summary::-webkit-details-marker{display:none}
.settings-panel{position:absolute;z-index:1;inset-block-start:100%;inset-inline-end:var(--gut-r);max-width:calc(100% - var(--gut-l) - var(--gut-r));padding:6px 14px;background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-lg)}
.settings-panel label{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.settings-panel input{width:18px;height:18px;accent-color:var(--accent)}

.bnav-in{max-width:740px;margin:0 auto;padding:4px max(4px,env(safe-area-inset-left,0px)) 4px max(4px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.bnav-a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px 2px;border-radius:12px;color:var(--ink-3);text-decoration:none;font-size:10.5px;font-weight:800;line-height:1.15;white-space:nowrap;touch-action:manipulation;transition:color .15s,background .15s}
.bnav-a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bnav-a:hover{color:var(--ink);background:var(--paper-2)}
.bnav-a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.bnav-a[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
@media (min-width:760px){
 .bnav{left:50%;right:auto;bottom:14px;transform:translateX(-50%);width:min(680px,calc(100% - 32px));border:1px solid var(--line-strong);border-radius:20px;padding-bottom:0;box-shadow:var(--shadow-lg)}
 body.playing .bnav{transform:translate(-50%,130%)}
 .bnav-in{padding:5px 8px;gap:4px}
 .bnav-a{flex-direction:row;gap:6px;min-height:46px;font-size:13px;padding:0 10px}
 .bnav-a svg{width:18px;height:18px}
 .bnav-a[aria-current="page"]::before{display:none}
}

/* ---------- 共通の部品 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:13px;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px;line-height:1.3;text-decoration:none;cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .12s,box-shadow .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.big{min-height:54px;padding:0 26px;font-size:17.5px}
.btn.small{min-height:44px;padding:0 15px;font-size:14.5px}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.btn:disabled{opacity:.45;cursor:default;filter:none;transform:none}
.linkbtn{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:4px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid transparent;color:var(--accent);text-decoration:none;font-size:14px;font-weight:800;cursor:pointer;text-align:left;touch-action:manipulation;transition:border-color .15s,transform .1s}
.linkbtn:hover{border-color:var(--accent)}
.linkbtn:active{transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hint{color:var(--ink-3);font-size:14px;margin:10px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-3)}
.h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6.2vw,40px);line-height:1.2;margin:6px 0 12px;outline:none}
.h2{font-size:18px;font-weight:800;margin:24px 0 10px}
.lead{font-size:15.5px;color:var(--ink-2);margin:0;line-height:1.7}
.intro{padding-block:4px 16px}
.intro p{max-width:62ch}
.rules{margin:12px 0 20px;padding:12px 16px 12px 32px;background:var(--paper);border:1px solid var(--line);border-radius:14px;color:var(--ink-2);font-size:14.5px}
.rules li+li{margin-top:5px}

.cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--c);white-space:nowrap}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tagc{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.stars{color:var(--star);letter-spacing:1px;font-size:12px;white-space:nowrap}
.st-off{color:var(--line-strong)}
.newb{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;background:var(--mark);color:var(--mark-ink);padding:3px 10px;border-radius:999px;animation:pop .4s}

/* ---------- ホーム ---------- */
.hero{display:grid;gap:14px;padding-block:6px 4px}
@media (min-width:760px){.hero{grid-template-columns:1.05fr 1fr;align-items:center;gap:22px;padding-block:14px 8px}}
.hero-txt{min-width:0}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,10vw,54px);line-height:1.08;letter-spacing:.01em;margin:6px 0 10px;outline:none}
@media (min-width:760px){.title{font-size:clamp(54px,7.2vw,84px);line-height:1.03;margin:8px 0 14px}}
.title span{white-space:nowrap;background:linear-gradient(transparent 60%,var(--mark) 60% 93%,transparent 93%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .05em}
.title br{display:none}
@media (min-width:760px){.title br{display:inline}}
.hero .lead{max-width:34em;font-size:15px}
@media (min-width:760px){.hero .lead{font-size:16px}}

.demo{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
@media (min-width:760px){.demo{padding:16px;border-radius:18px}}
.demo-k{margin:0 0 8px;font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.02em}
.demo-chat{display:flex;flex-direction:column;gap:6px;min-height:92px}
@media (min-width:760px){.demo-chat{min-height:120px;gap:8px}}
.dbub{max-width:90%;padding:7px 11px;border-radius:14px;font-size:14px;line-height:1.55}
@media (min-width:760px){.dbub{font-size:15px;padding:8px 12px}}
.dbub.dr{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.dbub.pt{align-self:flex-start;background:var(--paper-2);border:1px solid var(--line);border-bottom-left-radius:4px;min-height:2.2em;min-width:3em}
.demo-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.demo-opts span{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:9px;border:1.5px solid var(--line-strong);transition:all .3s}
.demo-opts .hit{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.05)}
.demo-opts .hit::before{content:"✓ "}

/* ホーム：図鑑進捗カード */
.prog{margin-top:14px;padding:13px 15px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.prog-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;margin-bottom:9px;font-size:14px}
.prog-n{display:inline-flex;align-items:baseline;gap:4px}
.prog-n b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.prog-pct{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);margin-left:4px;font-variant-numeric:tabular-nums}
.prog-r-btn{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:44px;padding:4px 10px;margin:-4px -6px;border-radius:10px;background:transparent;border:0;color:var(--ink);font-size:13.5px;cursor:pointer;text-align:right;touch-action:manipulation;transition:background .15s}
.prog-r-btn:hover{background:var(--paper-2)}
.prog-r-btn b{font-weight:800;color:var(--accent)}
.prog-next{color:var(--ink-3);font-size:12.5px}
.segs{display:flex;gap:3px;height:13px}
.seg{position:relative;border-radius:4px;overflow:hidden;min-width:6px}
.seg::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.22}
.seg i{position:relative;display:block;height:100%;background:var(--c);border-radius:4px;transition:width .5s ease}

/* ホーム：5つの遊び方 */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--ink-3)}
.modes{display:grid;gap:10px}
@media (min-width:640px){.modes{grid-template-columns:1fr 1fr;gap:12px}.mode.primary{grid-column:1/-1}}
.mode{position:relative;display:flex;gap:13px;align-items:center;min-height:84px;padding:14px 16px;background:var(--paper);border:1.5px solid var(--line);border-radius:17px;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0;touch-action:manipulation}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode:active{transform:scale(.99)}
.mode-ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center}
.mode-ic svg{width:25px;height:25px;fill:none;stroke:var(--accent);stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.mode-b{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.mode-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.mode-n{font-family:var(--f-display);font-size:20px;line-height:1.25}
.mode-badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--mark);color:var(--mark-ink);white-space:nowrap}
.mode-d{font-size:14px;color:var(--ink-2);line-height:1.55}
.mode-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--ink-3);font-weight:700}
.mode-best{color:var(--ok)}
.mode-bar{width:76px;height:6px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;display:inline-block;vertical-align:middle}
.mode-bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.mode-go{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:var(--ink-3);font-size:16px;font-weight:800;transition:transform .15s,background .15s,color .15s}
.mode:hover .mode-go{transform:translateX(2px);background:var(--accent-soft);color:var(--accent)}
.mode.primary{background:var(--hero-card-bg);border-color:var(--hero-card-bd);color:var(--hero-card-fg);padding:17px 18px}
.mode.primary .mode-ic{background:rgba(255,255,255,.18);width:54px;height:54px}
.mode.primary .mode-ic svg{stroke:var(--hero-card-fg);width:28px;height:28px}
.mode.primary .mode-d,.mode.primary .mode-m{color:var(--hero-card-fg);opacity:.92}
.mode.primary .mode-best{color:#FFE45C;opacity:1}
.mode.primary .mode-go{background:rgba(255,255,255,.22);color:var(--hero-card-fg)}
.mode.primary:hover{border-color:var(--mark)}
@media (min-width:640px){.mode.primary .mode-n{font-size:25px}}
.foot{margin-top:24px;font-size:12.5px;color:var(--ink-3);max-width:62ch;line-height:1.7}

/* ---------- 遊ぶ画面の上の帯 ---------- */
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:44px;padding-block:2px;margin-bottom:10px;font-size:14px}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 10px 0 4px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:800;background:none;border:0;cursor:pointer;white-space:nowrap;touch-action:manipulation;transition:background .15s,color .15s}
.back:hover{background:var(--paper);color:var(--accent)}
.gb-sp{flex:1}
.stat{color:var(--ink-3);white-space:nowrap;font-size:13.5px}
.stat b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums;display:inline-block}
.live-dot{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ng);padding:4px 10px;border-radius:999px;background:var(--ng-soft)}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.live-dot.off{color:var(--ink-2);background:var(--paper-2)}
.live-dot.off::before{animation:none}

/* 進捗ドット（診察ライブ・本番形式） */
.qdots{display:flex;align-items:center;gap:5px;margin:0 0 10px}
.qdot{flex:1;height:6px;border-radius:999px;background:var(--line);transition:background .25s,transform .25s}
.qdot.cur{background:var(--accent);transform:scaleY(1.35)}
.qdot.ok{background:var(--ok)}
.qdot.ng{background:var(--ng)}

/* ---------- 診察ライブ ---------- */
.karte{margin:0 0 10px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;font-size:15px;line-height:1.55}
.karte b{font-weight:800}
.karte-k{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:5px;margin-right:8px;vertical-align:1px}
.chat{display:flex;flex-direction:column;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:200px;max-height:min(44vh,420px);max-height:min(44dvh,420px);overflow-y:auto;overscroll-behavior:contain;box-shadow:var(--shadow)}
@media (min-width:720px){.chat{min-height:250px;max-height:min(50dvh,460px)}}
.bub{max-width:88%;padding:9px 14px;border-radius:17px;font-size:16px;line-height:1.65;overflow-wrap:anywhere;animation:bubIn .18s ease-out}
.bub.dr{align-self:flex-end;background:var(--accent-soft);color:var(--ink);border-bottom-right-radius:5px}
.bub.pt{align-self:flex-start;background:var(--paper-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.cut::after{content:"";display:inline-block;width:1.4em;margin-left:4px;border-bottom:2px dashed var(--ink-3);vertical-align:.3em}
.typing{align-self:flex-start;display:inline-flex;gap:5px;padding:12px 15px;background:var(--paper-2);border:1px solid var(--line);border-radius:17px;border-bottom-left-radius:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:dots 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
.typing.silent{background:transparent;border-style:dashed}
.typing.silent i{animation-duration:2.4s;opacity:.55}
.note{align-self:center;font-size:13px;color:var(--ink-3);padding:1px 10px}
.note.act{align-self:flex-start;background:var(--paper-2);border-radius:8px;padding:4px 10px;color:var(--ink-2)}

.answers{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
@media (min-width:540px){.answers{grid-template-columns:1fr 1fr;gap:10px}}
.ans{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:14px;font-size:16px;font-weight:800;line-height:1.35;text-align:left;cursor:pointer;touch-action:manipulation;transition:border-color .12s,background .12s,transform .12s,box-shadow .12s;min-width:0;overflow-wrap:anywhere}
@media (min-width:540px){.ans{min-height:58px}}
.ans:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(39,68,209,.1)}
.ans:active{transform:scale(.98)}
.ans-k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center;font-size:12.5px;color:var(--ink-3);font-family:var(--f-mono);font-weight:800;transition:background .15s,color .15s}
.ans:disabled{cursor:default;opacity:.5;transform:none;box-shadow:none}
.ans:disabled:hover{border-color:var(--line-strong)}
.ans.right{opacity:1;background:var(--ok-soft);border-color:var(--ok);border-width:2px;animation:ansPop .36s cubic-bezier(.2,1.35,.4,1)}
.ans.right .ans-k{background:var(--ok);color:#fff}
.ans.wrong{opacity:1;background:var(--ng-soft);border-color:var(--ng);border-width:2px;animation:shake .38s}
.ans.wrong .ans-k{background:var(--ng);color:#fff}

/* 解説ボックス */
.fb{margin-top:14px;padding:16px;background:var(--paper);border:1.5px solid var(--line);border-left-width:5px;border-radius:18px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow);animation:rise .25s ease-out}
.fb.is-ok{border-color:var(--ok)}
.fb.is-ng{border-color:var(--ng)}
.fb-h{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-display);font-size:21px;line-height:1.35}
.fb-badge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--f-body);font-size:15px;font-weight:900;flex:none}
.fb.is-ok .fb-h{color:var(--ok)}
.fb.is-ok .fb-badge{background:var(--ok);color:#fff}
.fb.is-ng .fb-h{color:var(--ng)}
.fb.is-ng .fb-badge{background:var(--ng);color:#fff}
.fb-why{margin:0;font-size:15.5px;line-height:1.8}
.kk{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:5px;margin-right:8px;vertical-align:1px}
.fb-ent{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:13px 14px;background:var(--paper-2);border-radius:13px}
.fb-ent p{flex-basis:100%;margin:2px 0 0;font-size:14.5px;color:var(--ink-2);line-height:1.75}
.fb-ent.dim{background:transparent;border:1.5px dashed var(--line-strong)}
.fb-t{font-size:18px;font-weight:800}
.fb-y{font-size:12.5px;color:var(--ink-3)}
.fb-link{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}


/* ---------- 結果 ---------- */
.result{padding-block:6px 20px}
.new-box{margin:14px 0;padding:13px 15px;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:14px}
.new-box-h{margin:0 0 8px;font-size:13.5px;font-weight:800;color:var(--ink)}
.new-chips{display:flex;flex-wrap:wrap;gap:6px}
.rec{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rec li{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 14px 10px 40px;background:var(--paper);border:1px solid var(--line);border-radius:13px;font-size:14.5px}
.rec li::before{position:absolute;left:14px;top:12px;font-weight:900;font-size:17px}
.rec li.ok::before{content:"○";color:var(--ok)}
.rec li.ng::before{content:"×";color:var(--ng)}
.rec-who,.rec-q{flex-basis:100%;font-size:12.5px;color:var(--ink-3)}
.rec-t{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-weight:700}
.rec-m{font-size:13px;color:var(--ink-2);font-weight:700}
.rec li.ng .rec-m{color:var(--ng)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mlist li{display:flex;flex-direction:column;gap:4px;padding:13px 15px;background:var(--paper);border:1px solid var(--line);border-radius:13px}
.mlist span{font-size:14.5px;color:var(--ink-2)}

/* ---------- 追体験ルーム：部屋の一覧 ---------- */
.soundrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;font-size:14px;padding:10px 14px;background:var(--paper);border:1.5px dashed var(--line-strong);border-radius:13px;margin-top:12px}
.soundrow.small{margin:0 0 10px}
.sn{color:var(--ink-2);flex:1 1 200px}
.room-prog{margin:12px 0 14px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.room-meter{flex:1 1 180px;display:flex;align-items:center;gap:10px;min-width:0}
.room-bar{flex:1;height:10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.room-bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.room-c{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:118px;padding:14px 14px 12px;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:16px 16px 6px 6px;text-align:left;cursor:pointer;touch-action:manipulation;transition:transform .15s,border-color .15s}
.room-c:hover{transform:translateY(-2px);border-color:var(--accent)}
.room-c:active{transform:scale(.98)}
.room-c::after{content:"";position:absolute;right:13px;top:56%;width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.room-top{display:flex;align-items:center;gap:7px;padding-right:48px}
.room-ic{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.room-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.room-c.cleared .room-ic{background:var(--paper);color:var(--ok)}
.room-no{font-size:11.5px;font-family:var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.room-n{font-weight:800;font-size:15.5px;line-height:1.4}
.room-a{margin-top:auto;font-size:13px;color:var(--ink-3);font-weight:700;padding-right:16px}
.room-s{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-2)}
.room-c.cleared{border-color:var(--ok);background:var(--ok-soft)}
.room-c.cleared .room-a{color:var(--ok)}
.room-c.cleared::after{background:var(--ok)}

/* ---------- 追体験ルーム：舞台（scenes.js の演出用クラスを維持） ---------- */
.stage{position:relative;overflow:hidden;min-height:300px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;isolation:isolate;box-shadow:var(--shadow)}
@media (min-width:720px){.stage{min-height:370px}}
.narr{margin:12px 0 8px;padding:11px 14px;min-height:3.4em;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;font-size:16.5px;line-height:1.65;font-weight:700}
.narr:empty{display:none}
.narr.in{animation:fadeIn .45s ease-out}
.task{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.task:empty{display:none}
.tiles{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.tile{min-height:48px;padding:6px 18px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line-strong);font-size:16px;font-weight:800;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s,opacity .2s}
.tile:hover{border-color:var(--accent)}
.tile.picked{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile:disabled{cursor:default}
.tile:disabled:not(.picked){opacity:.38}
.tq{margin-top:8px}
.tq-h{font-weight:800;font-size:17px;margin:6px 0 10px}

/* メモ帳（考想吹入・考想奪取・強迫観念） */
.memo{width:min(100%,340px);min-height:190px;padding:12px 18px 18px;border-radius:4px 4px 10px 10px;background-color:var(--note);background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);background-position:0 40px;box-shadow:var(--shadow);transform:rotate(-1deg)}
.memo-t{margin:0 0 8px;font-size:12.5px;font-weight:800;color:var(--ink-2);padding-bottom:4px;border-bottom:2px solid var(--ng)}
.memo-l{display:flex;flex-direction:column;align-items:flex-start}
.mchip{font-family:var(--f-hand);font-size:21px;line-height:34px;color:var(--ink);padding:0 2px;animation:writeIn .5s ease-out}
.mchip::before{content:"・"}
.mchip.alien{font-size:19px;font-family:var(--f-mincho);font-weight:700;color:var(--ng);letter-spacing:.06em;animation:alienIn .7s steps(6,end)}
.mchip.alien::before{content:""}
.mchip.alien{display:flex;flex-direction:column-reverse;align-items:flex-start;line-height:1.45;padding:3px 0 5px}
.mchip.alien small{margin:0 0 2px;vertical-align:0}
.mchip small{white-space:nowrap;font-family:var(--f-body);font-size:10px;font-weight:800;letter-spacing:.04em;background:var(--ng);color:var(--paper);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:4px}
.mchip.pulled{animation:pulled 1.1s cubic-bezier(.5,0,.8,.4) forwards}

/* 心の中・人の群れ（考想伝播） */
.thought{position:relative;padding:14px 26px;border:2px dashed var(--line-strong);border-radius:50%/45%;background:var(--paper-2);text-align:center;min-width:160px}
.thought-l{display:block;font-size:11px;color:var(--ink-3);font-weight:800;letter-spacing:.06em}
.thought b{font-family:var(--f-hand);font-weight:400;font-size:24px}
.crowd{display:flex;justify-content:center;gap:clamp(10px,4.5vw,30px);width:100%;margin-top:104px}
.pp{position:relative;display:flex;flex-direction:column;align-items:center;width:44px}
.pp-h{width:30px;height:30px;border-radius:50%;background:hsl(var(--h) 38% 58%)}
.pp-b{width:44px;height:54px;margin-top:4px;border-radius:22px 22px 8px 8px;background:hsl(var(--h) 34% 46%)}
.pp-say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:10px;white-space:nowrap;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;padding:3px 10px;font-size:13.5px;font-weight:800;z-index:2;animation:sayIn .3s ease-out;transition:opacity .5s}
.pp-say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.pp:first-child .pp-say{left:-4px;transform:none}
.pp:first-child .pp-say::after{left:22px}
.pp:last-child .pp-say{left:auto;right:-4px;transform:none}
.pp:last-child .pp-say::after{left:auto;right:17px}
.pp-say.out{opacity:0}
/* 隣どうしの吹き出しが重ならないよう、高さを3段に分ける */
.pp:nth-child(2) .pp-say{margin-bottom:68px}
.pp:nth-child(4) .pp-say{margin-bottom:38px}
.pp-say,.vbub,.mutter,.own,.revel{pointer-events:none}

/* 声になる（考想化声） */
.echo{position:relative;width:100%;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.echo b{position:relative;z-index:1;display:block;font-size:clamp(22px,5.5vw,28px);font-weight:900;color:var(--accent)}
.echo small{position:relative;z-index:1;display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid var(--accent);opacity:0}
.echo.on .ring{animation:ringOut 1.8s ease-out}
.echo.on .ring.r2{animation-delay:.45s}
.echo.on b{animation:voiceIn .5s ease-out}

/* 押させられるボタン（作為体験） */
.cbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.cbtn{width:88px;height:88px;border-radius:50%;border:0;background:var(--cc);color:#fff;font-size:17px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.12);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s,box-shadow .08s}
.cbtn.pressed{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.28);filter:brightness(1.12)}
.cres{margin:0;font-size:15px;color:var(--ink-2);text-align:center;min-height:1.7em}
.cres b{font-weight:900}
.ghost-hand{position:absolute;left:0;top:0;width:40px;height:48px;z-index:4;pointer-events:none;opacity:0;transition:transform .38s cubic-bezier(.3,.7,.3,1),opacity .2s}
.ghost-hand svg{width:100%;height:100%;fill:var(--ink);fill-opacity:.62;stroke:var(--paper);stroke-width:1.6}
.ghost-hand.on{opacity:1}

/* 本と声（対話性幻聴・注釈幻聴） */
.book{width:min(100%,520px);padding:18px 20px;background:var(--page);border:1px solid var(--line);border-radius:4px 10px 10px 4px;box-shadow:var(--shadow);font-family:var(--f-mincho);font-size:16.5px;line-height:2}
.book p{margin:0;text-indent:1em}
.book p+p{margin-top:.6em}
.vbub{position:absolute;z-index:4;max-width:min(74%,300px);padding:8px 13px;border-radius:14px;font-size:15px;font-weight:800;line-height:1.5;color:var(--on-voice);box-shadow:0 6px 18px rgba(0,0,0,.25);animation:vIn .35s ease-out;transition:opacity .6s,transform .6s}
.vbub small{display:block;font-size:10.5px;font-weight:700;opacity:.85;letter-spacing:.06em}
.vbub.vA{left:4%;background:var(--voice-a);border-bottom-left-radius:4px}
.vbub.vB{right:4%;background:var(--voice-b);border-bottom-right-radius:4px}
.vbub.out{opacity:0;transform:translateY(-8px)}

/* 部屋の片づけ（注釈幻聴） */
.room{position:relative;width:100%;height:240px;border-radius:12px;background-color:var(--paper-2);background-image:repeating-linear-gradient(90deg,transparent 0 46px,var(--line) 46px 47px);border:1px solid var(--line)}
.items{position:absolute;inset:0 0 56px 0}
.thing{position:absolute;left:var(--rx);top:var(--ry);min-height:44px;padding:8px 13px;border-radius:10px;background:var(--paper);border:1.5px solid var(--line-strong);font-size:15px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;transform:rotate(-3deg);transition:transform .5s ease-in,opacity .5s;touch-action:manipulation}
.thing:nth-child(even){transform:rotate(4deg)}
.thing.stowed{opacity:0;transform:translateY(80px) scale(.3);pointer-events:none}
.shelf{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:8px 18px;border-radius:6px;background:var(--box);color:var(--ink);font-weight:800;font-size:14px;white-space:nowrap;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}

/* 公園（妄想知覚） */
.stage.sc-park,.stage.sc-street,.stage.sc-cafe,.stage.sc-night{padding:0}
.park,.street,.cafe,.nightroom{position:absolute;inset:0;overflow:hidden}
.park{background:linear-gradient(var(--sky) 0 62%,var(--grass) 62%)}
.sun{position:absolute;top:10%;right:12%;width:54px;height:54px;border-radius:50%;background:#F5C443;box-shadow:0 0 0 10px rgba(245,196,67,.22)}
.tree{position:absolute;left:10%;bottom:34%;width:14px;height:62px;background:var(--trunk);border-radius:3px}
.tree::before{content:"";position:absolute;left:50%;bottom:44px;width:104px;height:104px;margin-left:-52px;border-radius:50%;background:var(--leaf)}
.bench{position:absolute;left:30%;bottom:30%;width:120px;height:10px;background:var(--wood);border-radius:3px}
.bench::before{content:"";position:absolute;left:0;right:0;top:-26px;height:8px;background:var(--wood);border-radius:3px}
.bench::after{content:"";position:absolute;left:10px;right:10px;top:10px;height:22px;border-left:8px solid var(--trunk);border-right:8px solid var(--trunk)}
.dog{position:absolute;right:8%;bottom:14%;width:min(38%,170px)}
.pawleg{transform-box:fill-box;transform-origin:50% 8%;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.dog.paw .pawleg{transform:rotate(-62deg)}
.flash{position:absolute;inset:0;z-index:5;background:#fff;pointer-events:none;animation:flash .9s ease-out forwards}
.revel{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);width:min(86%,420px);padding:18px 20px;border-radius:16px;background:var(--scrim);color:var(--on-scrim);text-align:center;animation:revelIn .6s ease-out;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.revel b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,5.4vw,28px);margin-bottom:6px}
.revel span{font-size:16px;line-height:1.7}

/* 流し（妄想着想） */
.sink{position:relative;width:min(100%,420px);padding:24px 14px 34px;border-radius:18px;background:linear-gradient(var(--steel),var(--steel-2));box-shadow:inset 0 3px 10px rgba(0,0,0,.18)}
.dishes{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.dish{position:relative;width:66px;height:66px;border-radius:50%;border:0;background:radial-gradient(circle,#fff 0 50%,#E3E9EC 52% 100%);box-shadow:0 3px 6px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation;transition:transform .15s}
.dish::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 40%,rgba(140,96,48,.55) 0 7px,transparent 8px),radial-gradient(circle at 62% 62%,rgba(160,110,50,.45) 0 9px,transparent 10px),radial-gradient(circle at 58% 30%,rgba(120,80,40,.4) 0 4px,transparent 5px);transition:opacity .35s}
.dish.clean::after{opacity:0}
.dish.clean{transform:scale(.94);box-shadow:0 0 0 3px rgba(255,255,255,.6),0 3px 6px rgba(0,0,0,.12)}
.sink-l{position:absolute;left:0;right:0;bottom:6px;margin:0;text-align:center;font-size:11px;font-weight:800;color:var(--ink-2)}

/* 帰り道（妄想気分） */
.street{transition:filter 2.5s}
.sky{position:absolute;inset:0 0 34% 0;background:linear-gradient(var(--dusk2),var(--dusk1));transition:filter 2.5s}
.houses{position:absolute;left:0;right:0;bottom:30%;height:42%;display:flex;align-items:flex-end;gap:6px;padding:0 8px;transition:filter 2.5s}
.houses i{flex:1;height:60%;border-radius:3px 3px 0 0;background-color:var(--house);background-image:linear-gradient(#F3D58A,#F3D58A),linear-gradient(#F3D58A,#F3D58A),linear-gradient(#F3D58A,#F3D58A),linear-gradient(#F3D58A,#F3D58A);background-size:8px 10px;background-repeat:no-repeat;background-position:26% 16%,74% 16%,26% 40%,74% 40%}
.houses i:nth-child(2){height:82%}
.houses i:nth-child(3){height:52%}
.houses i:nth-child(4){height:94%}
.houses i:nth-child(5){height:66%}
.road{position:absolute;left:0;right:0;bottom:0;height:30%;background:var(--road)}
.road::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px dashed rgba(255,255,255,.55)}
.walker{position:absolute;bottom:12%;left:-6%;width:14px;height:40px;border-radius:7px 7px 3px 3px;background:var(--coat);animation:walk 14s linear infinite}
.walker.w2{bottom:18%;animation-duration:21s;animation-delay:-8s;width:12px;height:34px}
.walker.w3{bottom:6%;animation-duration:17s;animation-delay:-3s;animation-direction:reverse}
.street::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,rgba(0,0,0,.6));opacity:0;transition:opacity 3s;pointer-events:none}
.stage.uneasy1 .sky{filter:saturate(.55) hue-rotate(-25deg)}
.stage.uneasy1 .houses{filter:saturate(.6)}
.stage.uneasy2 .street{animation:unease 7s ease-in-out infinite}
.stage.uneasy2 .street::after{opacity:.55}
.stage.uneasy3 .street::after{opacity:1}
.stage.uneasy3 .sky{filter:saturate(.35) hue-rotate(70deg) brightness(.8)}
.stage.uneasy3 .walker{animation-play-state:paused}
.stage.uneasy3 .houses{filter:saturate(.3) brightness(.75)}
.mutter{position:absolute;left:50%;z-index:4;transform:translateX(-50%);width:max-content;max-width:88%;padding:6px 14px;border-radius:10px;background:var(--scrim);color:var(--on-scrim);font-size:17px;font-weight:800;line-height:1.5;text-align:center;animation:mutterIn 3.6s ease-out forwards}

/* 鏡（離人感） */
.selfview{position:relative;width:100%;height:280px;display:flex;justify-content:center;align-items:center}
.mirror{position:relative;width:170px;height:240px;border-radius:85px 85px 12px 12px;border:7px solid var(--frame);background:linear-gradient(160deg,var(--glass2),var(--glass1) 60%,var(--glass2));overflow:hidden;display:flex;align-items:flex-end;justify-content:center;transition:transform 1.6s ease-in-out,filter 1.6s}
.me{width:92px;margin-bottom:-6px;transition:opacity 1.6s}
.person{display:block;width:100%;fill:var(--person)}
.arm-r{transform-box:fill-box;transform-origin:50% 6%;transition:transform .7s ease-in-out}
.me.raise .arm-r{transform:rotate(-150deg)}
.observer{position:absolute;left:50%;bottom:-40px;width:230px;height:120px;margin-left:-115px;border:2px dashed var(--ink-3);border-bottom:0;border-radius:115px 115px 0 0;opacity:0;transition:opacity 1.8s}
.observer::before{content:"";position:absolute;left:50%;top:-74px;width:80px;height:80px;margin-left:-40px;border-radius:50%;border:2px dashed var(--ink-3)}
.stage.derp1 .mirror{filter:saturate(.25) blur(.7px)}
.stage.derp1 .me{opacity:.7}
.stage.derp2 .mirror{transform:scale(.7) translateY(-34px)}
.stage.derp2 .observer{opacity:1}

/* カフェの窓（現実感消失） */
.cafe::before{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:var(--table)}
.cafe{background:var(--wall)}
.outside,.glass,.frame{position:absolute;top:9%;left:8%;right:8%;bottom:26%}
.outside{overflow:hidden;transition:filter 2.5s}
.csky{position:absolute;inset:0;background:linear-gradient(var(--sky),var(--glass2))}
.cground{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--pave)}
.ctree{position:absolute;bottom:20%;width:56px;height:56px;border-radius:50%;background:var(--leaf)}
.ctree::after{content:"";position:absolute;left:50%;top:90%;width:8px;height:22px;margin-left:-4px;background:var(--trunk)}
.ctree.t1{left:8%}.ctree.t2{left:44%;transform:scale(.8)}.ctree.t3{left:78%;transform:scale(1.1)}
.cperson{position:absolute;bottom:15%;left:-8%;width:12px;height:32px;border-radius:6px 6px 3px 3px;background:var(--coat);animation:walk 13s linear infinite}
.cperson.p2{animation-duration:18s;animation-delay:-9s;animation-direction:reverse;background:var(--voice-b)}
.ccar{position:absolute;bottom:4%;left:-20%;width:64px;height:20px;border-radius:9px 9px 4px 4px;background:#D9483B;animation:walk 6s linear infinite}
.glass{background:linear-gradient(125deg,rgba(255,255,255,.28),transparent 35%,rgba(255,255,255,.14) 55%,transparent 70%);pointer-events:none;transition:background-color 2.5s,backdrop-filter 2.5s}
.frame{border:10px solid var(--frame);border-radius:4px}
.frame::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;background:var(--frame)}
.cup{position:absolute;bottom:8%;left:12%;width:42px;height:32px;border-radius:2px 2px 14px 14px;background:var(--paper);border:2px solid var(--line-strong)}
.cup::after{content:"";position:absolute;right:-13px;top:5px;width:12px;height:14px;border:3px solid var(--line-strong);border-left:0;border-radius:0 8px 8px 0}
.stage.flat1 .outside{filter:saturate(.35) contrast(.8) blur(.8px)}
.stage.flat1 .glass{background-color:rgba(255,255,255,.14)}
.stage.flat2 .outside{filter:saturate(0) contrast(.62) blur(1.6px) brightness(1.06)}
.stage.flat2 .glass{background-color:rgba(255,255,255,.26)}
.stage.flat2 .cperson,.stage.flat2 .ccar{animation-timing-function:steps(7,end)}

/* 不安と確かめ（強迫観念） */
.anx{display:flex;align-items:center;gap:10px;width:min(100%,340px);font-size:13px;font-weight:800;color:var(--ink-2)}
.anx i{flex:1;height:12px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}
.anx b{display:block;height:100%;width:10%;background:linear-gradient(90deg,#F2B33D,var(--ng));transition:width .6s}
.own{position:absolute;left:50%;top:38%;z-index:4;transform:translateX(-50%);width:max-content;max-width:88%;padding:10px 16px;border-radius:16px;background:var(--paper);border:2px solid var(--ink);font-size:17px;font-weight:800;line-height:1.5;box-shadow:var(--shadow);animation:ownIn .4s ease-out;transition:opacity .6s}
.own small{display:block;font-size:11px;color:var(--accent);letter-spacing:.06em}
.own.out{opacity:0}

/* 換気扇（機能幻覚） */
.kitchen{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;min-height:250px}
.fan{position:relative;width:150px;height:150px;border-radius:18px;background:var(--steel);border:6px solid var(--steel-2);display:grid;place-items:center}
.blades{width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--blade) 0 26deg,transparent 26deg 90deg,var(--blade) 90deg 116deg,transparent 116deg 180deg,var(--blade) 180deg 206deg,transparent 206deg 270deg,var(--blade) 270deg 296deg,transparent 296deg)}
.fan::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--steel-2)}
.stage.fan-on .blades{animation:spin .32s linear infinite}
.waves{display:flex;gap:6px;height:24px;align-items:center}
.waves i{width:6px;height:14px;border-radius:3px;background:var(--ink-3);opacity:.25}
.stage.fan-on .waves i{opacity:.7;animation:wave .55s ease-in-out infinite alternate}
.stage.fan-on .waves i:nth-child(2){animation-delay:.18s}
.stage.fan-on .waves i:nth-child(3){animation-delay:.36s}
.fanlabel{margin:0;font-size:14px;color:var(--ink-3);letter-spacing:.3em;opacity:0;transition:opacity .3s}
.stage.fan-on .fanlabel{opacity:1}
.fanvoice{font-family:var(--f-mincho);font-size:21px;font-weight:700;color:var(--ng);letter-spacing:.12em;animation:fvIn 1.2s ease-out}

/* 夜中の部屋（錯覚） */
.nightroom{background:var(--wall);transition:filter .35s}
.win{position:absolute;top:10%;left:8%;width:26%;height:34%;background:radial-gradient(circle at 70% 30%,#F4F1D8 0 9px,transparent 10px),var(--winsky);border:6px solid var(--frame);border-radius:3px}
.bed{position:absolute;right:0;bottom:0;width:46%;height:22%;background:var(--bed);border-radius:14px 0 0 0}
.coatwrap{position:absolute;left:52%;top:6%;height:76%;transform:translateX(-50%);transition:transform 1.2s,filter 1.2s}
.coatwrap svg{height:100%;width:auto;display:block}
.coatwrap .hook{stroke:var(--ink-3)}
.coatwrap .coat{fill:var(--coat)}
.coatwrap .collar,.coatwrap .hat{fill:var(--coat-2)}
.coatwrap .btn{fill:var(--coat-2)}
.stage.dark .nightroom{filter:brightness(.22) contrast(1.3)}

function runScene(sc,tok){
 var chat=$('#chat');
 (async function(){
  await wait(450);
  for(var t=0;t<sc.turns.length;t++){
   if(tok!==runTok)return;
   chatAdd('bub dr',sc.turns[t][0]);
   await wait(650);
   if(tok!==runTok)return;
   var bs=sc.turns[t][1];
   for(var j=0;j<bs.length;j++){
    var b=bs[j];if(tok!==runTok)return;
    if(b.sil){var ty=chatAdd('typing silent','');if(ty)ty.innerHTML='<i></i><i></i><i></i>';await wait(b.sil);if(tok!==runTok)return;if(ty)ty.remove();chatAdd('note','（沈黙）');continue;}
    if(b.act){chatAdd('note act',b.t);await wait(500);continue;}
    if(b.pre){var ind=chatAdd('typing','');if(ind)ind.innerHTML='<i></i><i></i><i></i>';await wait(b.pre);if(tok!==runTok)return;if(ind)ind.remove();}
    var el=chatAdd('bub pt','');if(!el)return;
    var chars=Array.from(b.t);
    if(LV.fast||REDUCE){el.textContent=b.t;}
    else{for(var c=0;c<chars.length;c++){if(tok!==runTok)return;if(LV.fast){el.textContent=b.t;break;}el.textContent+=chars[c];chat.scrollTop=chat.scrollHeight;await wait(b.sp);}}
    if(b.cut)el.classList.add('cut');
    chat.scrollTop=chat.scrollHeight;
    await wait(350);
   }
   await wait(500);
  }
 })();
}

 '</div>';

var VIEW_NAMES={home:'ホーム',live:'診察ライブ',taiken:'追体験ルーム',dojo:'見分け道場',shiken:'本番形式',zukan:'症候図鑑'};
window.__feedbackWhere=function(){
 var parts=[VIEW_NAMES[current]||'ホーム'];
 if(current==='taiken'&&activeRoom&&activeRoom.scene){
  parts.push('部屋 '+(activeRoom.idx+1)+'「'+activeRoom.scene.name+'」');
 }else if(current==='live'&&LV){
  if(LV.ended)parts.push('結果');
  else if(LV.list&&LV.list[LV.i])parts.push('患者 '+(LV.i+1)+'/'+LV.list.length+'「'+LV.list[LV.i].who+'」');
 }else if(current==='dojo'&&DJ){
  if(DJ.over)parts.push('結果');
  else if(DJ.deck&&DJ.deck[DJ.k]){var p=DJ.deck[DJ.k].p;parts.push(p.la+'⇄'+p.lb);}
 }else if(current==='shiken'&&SK){
  if(SK.ended)parts.push('結果');
  else parts.push('問 '+(SK.i+1)+'/'+SK.qs.length);
 }else if(current==='zukan'&&ZF.cat&&ZF.cat!=='all'&&CATBY[ZF.cat]){
  parts.push(CATBY[ZF.cat].n);
 }
 var sh=$('#sheet');
 if(sh&&!sh.hidden&&activeSheetLabel)parts.push(activeSheetLabel);
 return parts.join('／');
};
