<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>開発日誌（note）｜精神科道場</title>
<!--
  紹介カードの小さな QR の行き先（https://gng2482-collab.github.io/psycho-games/note/）。
  note のアカウントができたら、下の NOTE_URL に入れて公開し直すだけで、カードを刷り直さずに行き先が変わる。
  空のあいだは「準備中」を出す。
-->
<style>
  :root { --teal:#1f6f6a; --soft:#e8f3f1; --ink:#1d2a33; --gray:#6e787d; --bg:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --soft:#1c2b2a; --ink:#e6eeec; --gray:#a3adb0; --bg:#121a1a; --teal:#5fb8b0; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; line-height:1.7; }
  main { max-width:560px; margin:0 auto; padding:40px 16px; }
  .band { height:6px; background:var(--teal); border-radius:3px; margin-bottom:28px; }
  .kicker { color:var(--teal); font-size:14px; margin:0; }
  h1 { font-size:26px; margin:4px 0 16px; }
  p { margin:0 0 14px; }
  .card { background:var(--soft); border-radius:12px; padding:18px; margin:20px 0; }
  a.btn { display:inline-block; background:var(--teal); color:#fff; text-decoration:none; padding:12px 18px; border-radius:10px; font-weight:600; }
  .muted { color:var(--gray); font-size:13px; }
</style>
<script data-goatcounter="https://psychogames.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <div class="band"></div>
  <p class="kicker">精神科医KM の</p>
  <h1>ローカルAI開発日誌</h1>
  <div id="go" hidden>
    <p>note の連載ページへ移動します…</p>
    <p><a class="btn" id="golink" href="#">note を開く</a></p>
  </div>
  <div id="soon">
    <p>一精神科医（精神科単科病院の専攻医）が、患者情報を外に出さない院内向けのAIを、Mac と無料で使えるAIモデルで作ってきた記録です。うまくいかなかったことも書いていきます。</p>
    <div class="card">
      <p><strong>連載は note で準備中です。</strong>始まったら、このページから読めるようになります。</p>
      <p class="muted">このページの住所は変わりません。ブックマークしておくと便利です。</p>
    </div>
    <p>それまでは、専攻医向けの練習アプリをどうぞ。</p>
    <p><a class="btn" href="../">精神科道場をひらく</a></p>
  </div>
</main>
<script>
  // note のアカウントができたら、ここに入れる（例：'https://note.com/xxxx'）。空なら「準備中」のまま。
  var NOTE_URL = 'https://note.com/kmpsychoai';
  if (NOTE_URL) {
    document.getElementById('soon').hidden = true;
    document.getElementById('go').hidden = false;
    document.getElementById('golink').href = NOTE_URL;
    // 数え上げ（GoatCounter）が送られる間だけ待ってから移る
    setTimeout(function () { location.replace(NOTE_URL); }, 900);
  }
</script>
</body>
</html>
