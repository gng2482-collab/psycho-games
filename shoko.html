/* プレイヤーごとに記録を分ける（自分は今までどおり、ゲストは頭に印をつける） */
(function () {
  try {
    var P = window.localStorage.getItem('ipad-player') || 'me';
    window.__ipadPlayer = P;
    if (P === 'me') return;
    var pre = 'p:' + P + ':', S = Storage.prototype, g = S.getItem, s = S.setItem, r = S.removeItem;
    var map = function (k) { return k === 'ipad-player' ? k : pre + k; };
    S.getItem = function (k) { return g.call(this, map(k)); };
    S.setItem = function (k, v) { return s.call(this, map(k), v); };
    S.removeItem = function (k) { return r.call(this, map(k)); };
  } catch (e) { /* 保存できない環境 */ }
})();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }

}

/* ---------- 土台 ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:920px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);min-height:54px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:18px;letter-spacing:.02em;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand b{font-weight:inherit;color:var(--accent)}
#rankchip{margin-left:auto;font-size:13px;line-height:1.3;padding:5px 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#rankchip b{font-weight:800}
.rk-n{color:var(--ink-3);font-variant-numeric:tabular-nums}
#soundbtn{flex:none;min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:transparent;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
#soundbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (max-width:400px){.rk-n{display:none}}

.wrap{max-width:920px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:14px 56px}
.view{min-width:0}

/* ---------- 共通の部品 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px;line-height:1.3;text-decoration:none;cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.big{min-height:56px;padding:0 28px;font-size:18px}
.btn.small{min-height:44px;padding:0 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.btn:disabled{opacity:.45;cursor:default;filter:none;transform:none}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:700;cursor:pointer;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hint{color:var(--ink-3);font-size:14px;margin:10px 0}
.eyebrow{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--ink-3)}
.h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6.4vw,42px);line-height:1.2;margin:6px 0 12px;outline:none}
.h2{font-size:18px;font-weight:800;margin:26px 0 10px}
.lead{font-size:16.5px;color:var(--ink-2);margin:0}
.intro{padding-block:4px 20px}
.intro p{max-width:62ch}
.rules{margin:12px 0 22px;padding-left:1.2em;color:var(--ink-2);font-size:15px}
.rules li+li{margin-top:4px}

.cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--c);white-space:nowrap}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tagc{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.stars{color:var(--star);letter-spacing:1px;font-size:12px;white-space:nowrap}
.st-off{color:var(--line-strong)}
.newb{font-size:11.5px;font-weight:800;background:var(--mark);color:var(--ink);padding:2px 9px;border-radius:999px}

/* ---------- ホーム ---------- */
.hero{display:grid;gap:22px;padding-block:18px 6px}
@media (min-width:760px){.hero{grid-template-columns:1.05fr 1fr;align-items:center}}
.hero-txt{min-width:0}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(60px,15vw,108px);line-height:1;letter-spacing:.01em;margin:10px 0 18px;outline:none}
@media (min-width:760px){.title{font-size:clamp(60px,9vw,100px)}}
.title span{white-space:nowrap;background:linear-gradient(transparent 58%,var(--mark) 58% 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .04em}
.hero .lead{max-width:34em}
.demo{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.demo-k{margin:0 0 12px;font-size:12px;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.02em}
.demo-chat{display:flex;flex-direction:column;gap:8px;min-height:132px}
.dbub{max-width:88%;padding:8px 12px;border-radius:15px;font-size:15px;line-height:1.6}
.dbub.dr{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.dbub.pt{align-self:flex-start;background:var(--paper-2);border:1px solid var(--line);border-bottom-left-radius:4px;min-height:2.2em;min-width:3em}
.demo-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.demo-opts span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line-strong);transition:all .3s}
.demo-opts .hit{background:var(--ok);border-color:var(--ok);color:var(--paper);transform:scale(1.06)}
.demo-opts .hit::before{content:"✓ "}

.prog{margin-top:22px}
.prog-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px;margin-bottom:8px;font-size:14px}
.prog-n b{font-family:var(--f-display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums;margin-right:2px}
.prog-r b{font-weight:800}
.prog-next{color:var(--ink-3)}
.segs{display:flex;gap:3px;height:12px}
.seg{position:relative;border-radius:3px;overflow:hidden;min-width:6px}
.seg::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.2}
.seg i{position:relative;display:block;height:100%;background:var(--c)}

.modes{display:grid;gap:12px;margin-top:24px}
@media (min-width:640px){.modes{grid-template-columns:1fr 1fr}.mode.primary{grid-column:1/-1}}
.mode{display:flex;gap:14px;align-items:flex-start;padding:18px;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s;min-width:0}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode-ic{flex:none;width:50px;height:50px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center}
.mode-ic svg{width:27px;height:27px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.mode-n{font-family:var(--f-display);font-size:21px;line-height:1.3}
.mode-d{font-size:14.5px;color:var(--ink-2);line-height:1.65}
.mode-m{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:12.5px;color:var(--ink-3);font-weight:700}
.mode-best{color:var(--ok)}
.mode.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mode.primary .mode-ic{background:rgba(255,255,255,.16)}
.mode.primary .mode-ic svg{stroke:var(--on-accent)}
.mode.primary .mode-d,.mode.primary .mode-m{color:var(--on-accent);opacity:.88}
.mode.primary .mode-best{color:var(--on-accent);text-decoration:underline;text-underline-offset:3px}
.mode.primary:hover{border-color:var(--ink)}
@media (min-width:640px){.mode.primary .mode-n{font-size:26px}}
.foot{margin-top:30px;font-size:12.5px;color:var(--ink-3);max-width:62ch}

/* ---------- 遊ぶ画面の上の帯 ---------- */
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:44px;padding-block:4px;margin-bottom:10px;font-size:14px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--ink-2);text-decoration:none;font-weight:800;background:none;border:0;padding:0 2px;cursor:pointer;white-space:nowrap}
.back:hover{color:var(--accent)}
.gb-sp{flex:1}
.stat{color:var(--ink-3);white-space:nowrap}
.stat b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.combo{background:var(--mark);color:var(--ink);padding:2px 10px;border-radius:999px;font-weight:800;font-size:12.5px;animation:pop .35s}
.live-dot{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ng)}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.live-dot.off{color:var(--ink-3)}
.live-dot.off::before{animation:none}

/* ---------- 診察ライブ ---------- */
.karte{margin:0 0 10px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:15px;line-height:1.6}
.karte b{font-weight:800}
.karte-k{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;border:1.5px solid var(--ink-2);color:var(--ink-2);padding:0 6px;border-radius:4px;margin-right:8px;vertical-align:1px}
.chat{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:240px;max-height:min(52vh,460px);overflow-y:auto;overscroll-behavior:contain}
.bub{max-width:86%;padding:9px 14px;border-radius:17px;font-size:16.5px;line-height:1.65;overflow-wrap:anywhere;animation:bubIn .18s ease-out}
.bub.dr{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:5px}
.bub.pt{align-self:flex-start;background:var(--paper-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.cut::after{content:"";display:inline-block;width:1.4em;margin-left:4px;border-bottom:2px dashed var(--ink-3);vertical-align:.3em}
.typing{align-self:flex-start;display:inline-flex;gap:5px;padding:13px 15px;background:var(--paper-2);border:1px solid var(--line);border-radius:17px;border-bottom-left-radius:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:dots 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
.typing.silent{background:transparent;border-style:dashed}
.typing.silent i{animation-duration:2.4s;opacity:.5}
.note{align-self:center;font-size:13px;color:var(--ink-3);padding:1px 10px}
.note.act{align-self:flex-start;background:var(--paper-2);border-radius:8px;padding:4px 10px;color:var(--ink-2)}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
@media (max-width:340px){.answers{grid-template-columns:1fr}}
.ans{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 12px;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:13px;font-size:16px;font-weight:800;line-height:1.35;text-align:left;cursor:pointer;touch-action:manipulation;transition:border-color .12s,background .12s,transform .1s;min-width:0}
.ans:hover{border-color:var(--accent)}
.ans:active{transform:scale(.98)}
.ans-k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--paper-2);display:grid;place-items:center;font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
.ans:disabled{cursor:default;opacity:.5;transform:none}
.ans:disabled:hover{border-color:var(--line-strong)}
.ans.right{opacity:1;background:var(--ok-soft);border-color:var(--ok)}
.ans.right .ans-k{background:var(--ok);color:var(--paper)}
.ans.wrong{opacity:1;background:var(--ng-soft);border-color:var(--ng)}
.ans.wrong .ans-k{background:var(--ng);color:var(--paper)}

.fb{margin-top:14px;padding:16px;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:10px;animation:rise .25s ease-out}
.fb.is-ok{border-color:var(--ok)}
.fb.is-ng{border-color:var(--ng)}
.fb-h{margin:0;font-family:var(--f-display);font-size:21px;line-height:1.35}
.fb.is-ok .fb-h{color:var(--ok)}
.fb.is-ng .fb-h{color:var(--ng)}
.fb-why{margin:0;font-size:15.5px;line-height:1.8}
.kk{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:1px 7px;border-radius:4px;margin-right:8px;vertical-align:2px}
.fb-ent{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:12px 14px;background:var(--paper-2);border-radius:12px}
.fb-ent p{flex-basis:100%;margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.75}
.fb-ent.dim{background:transparent;border:1px dashed var(--line-strong)}
.fb-t{font-size:18px;font-weight:800}
.fb-y{font-size:12.5px;color:var(--ink-3)}
.fb-link{margin:0;font-size:14px;color:var(--ink-2)}
.fb>.btn{align-self:flex-start}
.fb .row{margin-top:2px}

/* ---------- 結果 ---------- */
.result{padding-block:6px 20px}
.res-top{display:flex;align-items:center;gap:18px;margin:12px 0 8px}
.grade{flex:none;width:96px;height:96px;border-radius:22px;display:grid;place-items:center;font-family:var(--f-display);font-size:64px;line-height:1;background:var(--inv-bg);color:var(--inv-fg)}
.grade.g-S{background:var(--mark);color:var(--ink)}
.grade.g-A{background:var(--accent);color:var(--on-accent)}
.res-n{display:flex;flex-direction:column}
.res-n b{font-family:var(--f-display);font-weight:400;font-size:52px;line-height:1.1;font-variant-numeric:tabular-nums}
.res-n small{font-size:14px;color:var(--ink-2);font-weight:700}
.rec{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rec li{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:10px 14px 10px 40px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:14.5px}
.rec li::before{position:absolute;left:14px;top:9px;font-weight:900;font-size:16px}
.rec li.ok::before{content:"○";color:var(--ok)}
.rec li.ng::before{content:"×";color:var(--ng)}
.rec-who,.rec-q{flex-basis:100%;font-size:12.5px;color:var(--ink-3)}
.rec-t{flex:1;min-width:0;font-weight:700}
.rec-m{font-size:13px;color:var(--ink-2)}
.rec li.ng .rec-m{color:var(--ng)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mlist li{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.mlist span{font-size:14.5px;color:var(--ink-2)}

/* ---------- 追体験ルーム：部屋の一覧 ---------- */
.soundrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;padding:10px 14px;background:var(--paper);border:1.5px dashed var(--line-strong);border-radius:12px;margin-top:14px}
.soundrow.small{margin:0 0 10px}
.sn{color:var(--ink-2)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:6px}
.room-c{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:118px;padding:14px 14px 12px;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:16px 16px 6px 6px;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}
.room-c:hover{transform:translateY(-2px);border-color:var(--accent)}
.room-c::after{content:"";position:absolute;right:13px;top:56%;width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.room-no{font-size:11.5px;font-family:var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.room-n{font-weight:800;font-size:16px;line-height:1.4}
.room-a{margin-top:auto;font-size:13px;color:var(--ink-3);font-weight:700;padding-right:16px}
.room-s{position:absolute;top:11px;right:11px;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-2)}
.room-c.cleared{border-color:var(--ok);background:var(--ok-soft)}
.room-c.cleared .room-a{color:var(--ok)}
.room-c.cleared::after{background:var(--ok)}

/* ---------- 追体験ルーム：舞台 ---------- */
.stage{position:relative;overflow:hidden;min-height:320px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;isolation:isolate}
@media (min-width:720px){.stage{min-height:380px}}
.narr{margin:14px 2px 8px;min-height:3.4em;font-size:17px;line-height:1.7;font-weight:600}
.narr.in{animation:fadeIn .45s ease-out}
.task{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.task:empty{display:none}
.tiles{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.tile{min-height:48px;padding:6px 18px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line-strong);font-size:16px;font-weight:800;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s,opacity .2s}
.tile:hover{border-color:var(--accent)}
.tile.picked{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile:disabled{cursor:default}
.tile:disabled:not(.picked){opacity:.38}
.tq{margin-top:8px}
.tq-h{font-weight:800;font-size:17px;margin:6px 0 10px}

/* メモ帳（考想吹入・考想奪取・強迫観念） */
.memo{width:min(100%,340px);min-height:190px;padding:12px 18px 18px;border-radius:4px 4px 10px 10px;background-color:var(--note);background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule) 33px 34px);background-position:0 40px;box-shadow:var(--shadow);transform:rotate(-1deg)}
.memo-t{margin:0 0 8px;font-size:12.5px;font-weight:800;color:var(--ink-2);padding-bottom:4px;border-bottom:2px solid var(--ng)}
.memo-l{display:flex;flex-direction:column;align-items:flex-start}
.mchip{font-family:var(--f-hand);font-size:21px;line-height:34px;color:var(--ink);padding:0 2px;animation:writeIn .5s ease-out}
.mchip::before{content:"・"}
.mchip.alien{font-size:19px;font-family:var(--f-mincho);font-weight:700;color:var(--ng);letter-spacing:.06em;animation:alienIn .7s steps(6,end)}
.mchip.alien::before{content:""}
.mchip.alien{display:flex;flex-direction:column-reverse;align-items:flex-start;line-height:1.45;padding:3px 0 5px}
.mchip.alien small{margin:0 0 2px;vertical-align:0}
.mchip small{white-space:nowrap;font-family:var(--f-body);font-size:10px;font-weight:800;letter-spacing:.04em;background:var(--ng);color:var(--paper);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:4px}
.mchip.pulled{animation:pulled 1.1s cubic-bezier(.5,0,.8,.4) forwards}

/* 心の中・人の群れ（考想伝播） */
.thought{position:relative;padding:14px 26px;border:2px dashed var(--line-strong);border-radius:50%/45%;background:var(--paper-2);text-align:center;min-width:160px}
.thought-l{display:block;font-size:11px;color:var(--ink-3);font-weight:800;letter-spacing:.06em}
.thought b{font-family:var(--f-hand);font-weight:400;font-size:24px}
.crowd{display:flex;justify-content:center;gap:clamp(10px,4.5vw,30px);width:100%;margin-top:104px}
.pp{position:relative;display:flex;flex-direction:column;align-items:center;width:44px}
.pp-h{width:30px;height:30px;border-radius:50%;background:hsl(var(--h) 38% 58%)}
.pp-b{width:44px;height:54px;margin-top:4px;border-radius:22px 22px 8px 8px;background:hsl(var(--h) 34% 46%)}
.pp-say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:10px;white-space:nowrap;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;padding:3px 10px;font-size:13.5px;font-weight:800;z-index:2;animation:sayIn .3s ease-out;transition:opacity .5s}
.pp-say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.pp:first-child .pp-say{left:-4px;transform:none}
.pp:first-child .pp-say::after{left:22px}
.pp:last-child .pp-say{left:auto;right:-4px;transform:none}
.pp:last-child .pp-say::after{left:auto;right:17px}
.pp-say.out{opacity:0}
/* 隣どうしの吹き出しが重ならないよう、高さを3段に分ける */
.pp:nth-child(2) .pp-say{margin-bottom:68px}
.pp:nth-child(4) .pp-say{margin-bottom:38px}
.pp-say,.vbub,.mutter,.own,.revel{pointer-events:none}

/* 声になる（考想化声） */
.echo{position:relative;width:100%;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.echo b{position:relative;z-index:1;display:block;font-size:clamp(22px,5.5vw,28px);font-weight:900;color:var(--accent)}
.echo small{position:relative;z-index:1;display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid var(--accent);opacity:0}
.echo.on .ring{animation:ringOut 1.8s ease-out}
.echo.on .ring.r2{animation-delay:.45s}
.echo.on b{animation:voiceIn .5s ease-out}

/* 押させられるボタン（作為体験） */
.cbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.cbtn{width:92px;height:92px;border-radius:50%;border:0;background:var(--cc);color:#fff;font-size:17px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.12);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s,box-shadow .08s}
.cbtn.pressed{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.28);filter:brightness(1.12)}
.cres{margin:0;font-size:15px;color:var(--ink-2);text-align:center;min-height:1.7em}
.cres b{font-weight:900}
.ghost-hand{position:absolute;left:0;top:0;width:40px;height:48px;z-index:4;pointer-events:none;opacity:0;transition:transform .38s cubic-bezier(.3,.7,.3,1),opacity .2s}
.ghost-hand svg{width:100%;height:100%;fill:var(--ink);fill-opacity:.62;stroke:var(--paper);stroke-width:1.6}
.ghost-hand.on{opacity:1}

/* 本と声（対話性幻聴・注釈幻聴） */
.book{width:min(100%,520px);padding:18px 22px;background:var(--page);border:1px solid var(--line);border-radius:4px 10px 10px 4px;box-shadow:var(--shadow);font-family:var(--f-mincho);font-size:16.5px;line-height:2}
.book p{margin:0;text-indent:1em}
.book p+p{margin-top:.6em}
.vbub{position:absolute;z-index:4;max-width:min(72%,300px);padding:8px 13px;border-radius:14px;font-size:15px;font-weight:800;line-height:1.5;color:var(--on-voice);box-shadow:0 6px 18px rgba(0,0,0,.2);animation:vIn .35s ease-out;transition:opacity .6s,transform .6s}
.vbub small{display:block;font-size:10.5px;font-weight:700;opacity:.8;letter-spacing:.06em}
.vbub.vA{left:4%;background:var(--voice-a);border-bottom-left-radius:4px}
.vbub.vB{right:4%;background:var(--voice-b);border-bottom-right-radius:4px}
.vbub.out{opacity:0;transform:translateY(-8px)}

/* 部屋の片づけ（注釈幻聴） */
.room{position:relative;width:100%;height:240px;border-radius:12px;background-color:var(--paper-2);background-image:repeating-linear-gradient(90deg,transparent 0 46px,var(--line) 46px 47px);border:1px solid var(--line)}
.items{position:absolute;inset:0 0 56px 0}
.thing{position:absolute;left:var(--rx);top:var(--ry);padding:8px 12px;border-radius:10px;background:var(--paper);border:1.5px solid var(--line-strong);font-size:15px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;transform:rotate(-3deg);transition:transform .5s ease-in,opacity .5s;touch-action:manipulation}
.thing:nth-child(even){transform:rotate(4deg)}
.thing.stowed{opacity:0;transform:translateY(80px) scale(.3);pointer-events:none}
.shelf{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:8px 18px;border-radius:6px;background:var(--box);color:var(--ink);font-weight:800;font-size:14px;white-space:nowrap;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}

/* 公園（妄想知覚） */
.stage.sc-park,.stage.sc-street,.stage.sc-cafe,.stage.sc-night{padding:0}
.park,.street,.cafe,.nightroom{position:absolute;inset:0;overflow:hidden}
.park{background:linear-gradient(var(--sky) 0 62%,var(--grass) 62%)}
.sun{position:absolute;top:10%;right:12%;width:54px;height:54px;border-radius:50%;background:#F5C443;box-shadow:0 0 0 10px rgba(245,196,67,.22)}
.tree{position:absolute;left:10%;bottom:34%;width:14px;height:62px;background:var(--trunk);border-radius:3px}
.tree::before{content:"";position:absolute;left:50%;bottom:44px;width:104px;height:104px;margin-left:-52px;border-radius:50%;background:var(--leaf)}
.bench{position:absolute;left:30%;bottom:30%;width:120px;height:10px;background:var(--wood);border-radius:3px}
.bench::before{content:"";position:absolute;left:0;right:0;top:-26px;height:8px;background:var(--wood);border-radius:3px}
.bench::after{content:"";position:absolute;left:10px;right:10px;top:10px;height:22px;border-left:8px solid var(--trunk);border-right:8px solid var(--trunk)}
.dog{position:absolute;right:8%;bottom:14%;width:min(38%,170px)}
.pawleg{transform-box:fill-box;transform-origin:50% 8%;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.dog.paw .pawleg{transform:rotate(-62deg)}
.flash{position:absolute;inset:0;z-index:5;background:#fff;pointer-events:none;animation:flash .9s ease-out forwards}
.revel{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);width:min(86%,420px);padding:18px 20px;border-radius:16px;background:var(--scrim);color:var(--on-scrim);text-align:center;animation:revelIn .6s ease-out;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.revel b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,5.4vw,28px);margin-bottom:6px}
.revel span{font-size:16px;line-height:1.7}

/* 流し（妄想着想） */
.sink{position:relative;width:min(100%,420px);padding:24px 14px 34px;border-radius:18px;background:linear-gradient(var(--steel),var(--steel-2));box-shadow:inset 0 3px 10px rgba(0,0,0,.18)}
.dishes{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.dish{position:relative;width:66px;height:66px;border-radius:50%;border:0;background:radial-gradient(circle,#fff 0 50%,#E3E9EC 52% 100%);box-shadow:0 3px 6px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation;transition:transform .15s}
.dish::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 40%,rgba(140,96,48,.55) 0 7px,transparent 8px),radial-gradient(circle at 62% 62%,rgba(160,110,50,.45) 0 9px,transparent 10px),radial-gradient(circle at 58% 30%,rgba(120,80,40,.4) 0 4px,transparent 5px);transition:opacity .35s}
.dish.clean::after{opacity:0}
.dish.clean{transform:scale(.94);box-shadow:0 0 0 3px rgba(255,255,255,.6),0 3px 6px rgba(0,0,0,.12)}
.sink-l{position:absolute;left:0;right:0;bottom:6px;margin:0;text-align:center;font-size:11px;font-weight:800;color:var(--ink-2)}

/* 帰り道（妄想気分） */
.street{transition:filter 2.5s}
.sky{position:absolute;inset:0 0 34% 0;background:linear-gradient(var(--dusk2),var(--dusk1));transition:filter 2.5s}
.houses{position:absolute;left:0;right:0;bottom:30%;height:42%;display:flex;align-items:flex-end;gap:6px;padding:0 8px;transition:filter 2.5s}
.houses i{flex:1;height:60%;border-radius:3px 3px 0 0;background-color:var(--house);background-image:linear-gradient(#F3D58A,#F3D58A),linear-gradient(#F3D58A,#F3D58A),linear-gradient(#F3D58A,#F3D58A),linear-gradient(#F3D58A,#F3D58A);background-size:8px 10px;background-repeat:no-repeat;background-position:26% 16%,74% 16%,26% 40%,74% 40%}
.houses i:nth-child(2){height:82%}
.houses i:nth-child(3){height:52%}
.houses i:nth-child(4){height:94%}
.houses i:nth-child(5){height:66%}
.road{position:absolute;left:0;right:0;bottom:0;height:30%;background:var(--road)}
.road::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px dashed rgba(255,255,255,.55)}
.walker{position:absolute;bottom:12%;left:-6%;width:14px;height:40px;border-radius:7px 7px 3px 3px;background:var(--coat);animation:walk 14s linear infinite}
.walker.w2{bottom:18%;animation-duration:21s;animation-delay:-8s;width:12px;height:34px}
.walker.w3{bottom:6%;animation-duration:17s;animation-delay:-3s;animation-direction:reverse}
.street::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,rgba(0,0,0,.6));opacity:0;transition:opacity 3s;pointer-events:none}
.stage.uneasy1 .sky{filter:saturate(.55) hue-rotate(-25deg)}
.stage.uneasy1 .houses{filter:saturate(.6)}
.stage.uneasy2 .street{animation:unease 7s ease-in-out infinite}
.stage.uneasy2 .street::after{opacity:.55}
.stage.uneasy3 .street::after{opacity:1}
.stage.uneasy3 .sky{filter:saturate(.35) hue-rotate(70deg) brightness(.8)}
.stage.uneasy3 .walker{animation-play-state:paused}
.stage.uneasy3 .houses{filter:saturate(.3) brightness(.75)}
.mutter{position:absolute;left:50%;z-index:4;transform:translateX(-50%);width:max-content;max-width:88%;padding:6px 14px;border-radius:10px;background:var(--scrim);color:var(--on-scrim);font-size:17px;font-weight:800;line-height:1.5;text-align:center;animation:mutterIn 3.6s ease-out forwards}

/* 鏡（離人感） */
.selfview{position:relative;width:100%;height:280px;display:flex;justify-content:center;align-items:center}
.mirror{position:relative;width:170px;height:240px;border-radius:85px 85px 12px 12px;border:7px solid var(--frame);background:linear-gradient(160deg,var(--glass2),var(--glass1) 60%,var(--glass2));overflow:hidden;display:flex;align-items:flex-end;justify-content:center;transition:transform 1.6s ease-in-out,filter 1.6s}
.me{width:92px;margin-bottom:-6px;transition:opacity 1.6s}
.person{display:block;width:100%;fill:var(--person)}
.arm-r{transform-box:fill-box;transform-origin:50% 6%;transition:transform .7s ease-in-out}
.me.raise .arm-r{transform:rotate(-150deg)}
.observer{position:absolute;left:50%;bottom:-40px;width:230px;height:120px;margin-left:-115px;border:2px dashed var(--ink-3);border-bottom:0;border-radius:115px 115px 0 0;opacity:0;transition:opacity 1.8s}
.observer::before{content:"";position:absolute;left:50%;top:-74px;width:80px;height:80px;margin-left:-40px;border-radius:50%;border:2px dashed var(--ink-3)}
.stage.derp1 .mirror{filter:saturate(.25) blur(.7px)}
.stage.derp1 .me{opacity:.7}
.stage.derp2 .mirror{transform:scale(.7) translateY(-34px)}
.stage.derp2 .observer{opacity:1}

/* カフェの窓（現実感消失） */
.cafe::before{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:var(--table)}
.cafe{background:var(--wall)}
.outside,.glass,.frame{position:absolute;top:9%;left:8%;right:8%;bottom:26%}
.outside{overflow:hidden;transition:filter 2.5s}
.csky{position:absolute;inset:0;background:linear-gradient(var(--sky),var(--glass2))}

function noise(kind){quiet();if(!S.sound)return;var c=ac();if(!c)return;
 if(kind==='fan'){var len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;var src=c.createBufferSource();src.buffer=buf;src.loop=true;var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=420;var g=c.createGain();g.gain.value=.09;src.connect(f);f.connect(g);g.connect(c.destination);src.start();noiseStop=function(){try{src.stop();}catch(e){}};}
 else{var o1=c.createOscillator(),o2=c.createOscillator(),g2=c.createGain();o1.frequency.value=55;o2.frequency.value=58.5;g2.gain.setValueAtTime(0.0001,c.currentTime);g2.gain.linearRampToValueAtTime(.09,c.currentTime+3);o1.connect(g2);o2.connect(g2);g2.connect(c.destination);o1.start();o2.start();noiseStop=function(){try{o1.stop();o2.stop();}catch(e){}};}
}

function chatAdd(cls,text){var c=$('#chat');var d=document.createElement('div');d.className=cls;d.textContent=text||'';c.appendChild(d);c.scrollTop=c.scrollHeight;return d;}
function runScene(sc,tok){
 var chat=$('#chat');
 (async function(){
  await wait(450);
  for(var t=0;t<sc.turns.length;t++){
   if(tok!==runTok)return;
   chatAdd('bub dr',sc.turns[t][0]);
   await wait(650);
   if(tok!==runTok)return;
   if(t===0)$$('#answers .ans').forEach(function(b){b.disabled=false;});
   var bs=sc.turns[t][1];
   for(var j=0;j<bs.length;j++){
    var b=bs[j];if(tok!==runTok)return;
    if(b.sil){var ty=chatAdd('typing silent','');ty.innerHTML='<i></i><i></i><i></i>';await wait(b.sil);if(tok!==runTok)return;ty.remove();chatAdd('note','（沈黙）');continue;}
    if(b.act){chatAdd('note act',b.t);await wait(500);continue;}
    if(b.pre){var ind=chatAdd('typing','');ind.innerHTML='<i></i><i></i><i></i>';await wait(b.pre);if(tok!==runTok)return;ind.remove();}
    var el=chatAdd('bub pt','');
    var chars=Array.from(b.t);
    if(LV.fast||REDUCE){el.textContent=b.t;}
    else{for(var c=0;c<chars.length;c++){if(tok!==runTok)return;if(LV.fast){el.textContent=b.t;break;}el.textContent+=chars[c];chat.scrollTop=chat.scrollHeight;await wait(b.sp);}}
    if(b.cut)el.classList.add('cut');
    chat.scrollTop=chat.scrollHeight;
    await wait(350);
   }
   await wait(500);
  }
  if(tok!==runTok)return;
  LV.done=true;
  var h=$('#lv-hint');if(h&&!LV.answered)h.textContent='話が終わりました。症状名を選んでください。';
 })();
}

 $('#v-dojo').innerHTML='<div class="gbar"><a class="back" href="#home">← ホーム</a><span class="timer"><i id="dj-bar"></i></span><span class="stat"><b id="dj-left">60</b>秒</span><span class="stat"><b id="dj-sc">0</b>枚</span></div>'+

 var c=DJ.deck[DJ.k];

 function up(){if(x0==null)return;x0=null;el.classList.remove('drag','to-a','to-b');if(Math.abs(dx)>80){dojoAnswer(dx<0?'a':'b');}else{el.style.transform='';}}

function dojoAnswer(side){

 DJ.n++;

  DJ.score++;DJ.ok++;DJ.streak++;sfx('ok');catchTerm(c.side==='a'?c.p.a:c.p.b);

  $('#dj-sc').textContent=DJ.score;

 }else{
  DJ.streak=0;DJ.left=Math.max(0,DJ.left-3);sfx('ng');DJ.lock=true;miss(c.side==='a'?c.p.a:c.p.b);

  $('#arena').appendChild(r);
  var go=function(){if(!DJ.lock||DJ.over)return;DJ.lock=false;DJ.k++;dojoCard();};
  $('#dj-ok').addEventListener('click',go);

 }
}

 var t=pick(pool,1)[0];var ex=NEAR[t.id]||{};
 var ok=function(e){return e.id!==t.id&&!GEN[e.id]&&!ex[e.id];};
 var same=shuffle(ENT.filter(function(e){return ok(e)&&e.c===t.c;}));
 var other=shuffle(ENT.filter(function(e){return ok(e)&&e.c!==t.c;}));
 var ds=same.concat(other).slice(0,4);
 return {q:'次の説明に当てはまる用語はどれか。',quote:t.d,a:[t.t].concat(ds.map(function(e){return e.t;})),link:t.id,why:t.k,gen:1};
}
